<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chetan | Video Editor</title>
<style>
  :root{
    --bg: #0b0b0d;
    --text: #f2f2f0;
    --muted: #8a8a8f;
    --accent: #d4ff3f;
    --line: #232326;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding: 40px 24px 0;
    text-align:center;
  }
  .eyebrow{
    color:var(--muted);
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
  }
  main{
    flex:1;
    padding: 40px 24px;
  }
  .intro{
    text-align:center;
    margin-bottom:40px;
  }
  h1{
    font-size: clamp(32px, 7vw, 64px);
    font-weight:700;
    line-height:1.05;
    letter-spacing:-1px;
  }
  h1 span{ color:var(--accent); }
  p.tagline{
    color:var(--muted);
    margin-top:16px;
    font-size:16px;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
    max-width:1100px;
    margin:0 auto;
  }
  .video-box{
    aspect-ratio: 9/16;
    max-width:320px;
    justify-self:center;
    background:#141416;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .video-box iframe{
    width:100%;
    height:100%;
    border:0;
  }
  .caption{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:6px;
  }
  footer{
    border-top:1px solid var(--line);
    padding:28px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    font-size:14px;
  }
  footer a{
    color:var(--text);
    text-decoration:none;
    opacity:0.8;
  }
  footer a:hover{ opacity:1; color:var(--accent); }
  .dot{ color:var(--line); }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Video Editor</div>
  </header>

  <main>
    <div class="intro">
      <h1>Chetan<span>.</span></h1>
      <p class="tagline">Edits for YouTube & Instagram — After Effects, Premiere, DaVinci Resolve, CapCut.</p>
    </div>

    <div class="grid">
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/4pOXjAnKeYI?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/GTPcxI39aWg?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/5SSZikLi3BE?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/9WVambaotTU?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/3f68WGkMlEI?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/gtUtih0e9HI?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/L8lJ0l1kmBA?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/lJ6QsfuK3Uk?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/Zvvc_ejTGIo?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
      <div><div class="video-box"><iframe src="https://www.youtube.com/embed/ZB4-b1aDfk4?modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div>
    </div>
  </main>

  <footer>
    <a href="mailto:visiongrid.pro@gmail.com">visiongrid.pro@gmail.com</a>
    <span class="dot">·</span>
    <a href="https://instagram.com/baffling.speed" target="_blank" rel="noopener">@baffling.speed</a>
    <span class="dot">·</span>
    <a href="#">WhatsApp (soon)</a>
  </footer>

</body>
</html>
